# .pre-commit-config.yaml
# Python tools run as local hooks through uv, so pre-commit, CI and `just`
# use exactly the versions pinned in uv.lock and the config in pyproject.toml.
# Remote mirrors pinned their own (older) versions and diverged from the lock:
# ruff-format rewrote files back and forth, mypy ran non-strict, and pip-audit
# audited the hook's private virtualenv instead of the project environment.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: mypy --strict (src + tests)
        entry: uv run --frozen mypy src tests
        language: system
        pass_filenames: false
        types_or: [python, pyi]

      - id: bandit
        name: bandit
        entry: uv run --frozen bandit -c pyproject.toml -r src
        language: system
        pass_filenames: false
        types_or: [python]

      # setuptools 81.0.0 is an accepted risk: neurokit2 0.2.13 declares
      # setuptools<82, so no resolvable fix exists. setuptools is a build-time
      # tool, not imported by bci_calib at runtime.
      #   PYSEC-2026-3447 (fix 83.0.0): MANIFEST.in exclusion bypass when
      #     building an sdist on macOS. This project builds on Linux.
      #   GHSA-xmj3-9gf7-h52w (fix 84.1.0): Windows only, crafted wheel in the
      #     legacy install_as_egg path. This project installs with uv on Linux.
      # Re-check on every neurokit2 release and remove both ignores once the
      # cap is lifted.
      - id: pip-audit
        name: pip-audit (project environment)
        entry: >-
          uv run --frozen pip-audit --skip-editable
          --ignore-vuln PYSEC-2026-3447
          --ignore-vuln GHSA-xmj3-9gf7-h52w
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
